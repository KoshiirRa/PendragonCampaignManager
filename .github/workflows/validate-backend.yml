name: Validate backend

on:
  pull_request:
    paths:
      - "app/**"
      - "migrations/**"
      - "scripts/**"
      - "seed/**"
      - "supabase/**"
      - "tests/**"
      - ".github/workflows/validate-backend.yml"
      - "alembic.ini"
      - "Dockerfile"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "scripts/**"
      - "seed/**"
      - "supabase/**"
      - "tests/**"
      - ".github/workflows/validate-backend.yml"
      - "alembic.ini"
      - "Dockerfile"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pendragon
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pendragon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pendragon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/sync_supabase_migrations.py --check
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m alembic heads
      - run: python -m alembic upgrade head
      - run: python -m compileall -q app migrations tests

  container:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag pendragon-campaign-api:python314 .
      - run: docker run --rm pendragon-campaign-api:python314 python --version
      - run: docker run --rm pendragon-campaign-api:python314 python -c "import sys; assert sys.version_info[:2] == (3, 14)"
